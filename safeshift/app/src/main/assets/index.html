<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeShift Emergency OS</title>
    <style>
        :root {
            --primary: #ef4444;
            --primary-glow: rgba(239, 68, 68, 0.45);
            --bg: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .shield-icon {
            font-size: 32px;
            margin-bottom: 4px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulse-dot 1.5s infinite;
        }

        /* Animated SOS Button */
        .sos-wrapper {
            position: relative;
            margin: 20px 0 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: var(--primary-glow);
            animation: ripple 2s ease-out infinite;
            z-index: 1;
        }

        .sos-btn {
            position: relative;
            z-index: 2;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff5252, #b91c1c);
            border: 4px solid #fecaca;
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.55), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .sos-btn:active {
            transform: scale(0.93);
            filter: brightness(1.2);
        }

        .sos-subtext {
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* Card Panels */
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        .btn-add {
            padding: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .btn-add:active {
            opacity: 0.85;
        }

        /* Contacts List */
        .contacts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
        }

        .contact-name {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .contact-num {
            font-size: 11px;
            color: var(--text-sub);
        }

        .btn-del {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .empty-text {
            color: var(--text-sub);
            font-size: 12px;
            text-align: center;
            padding: 10px 0;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="shield-icon">🛡️</div>
    <h1>SafeShift Shield</h1>
    <div class="status-badge">
        <span class="status-dot"></span>
        Hardware GPS Active (Offline)
    </div>
</div>

<div class="sos-wrapper">
    <div class="pulse-ring"></div>
    <button class="sos-btn" onclick="triggerSOS()">
        SOS
        <span class="sos-subtext">DISPATCH</span>
    </button>
</div>

<!-- Contact Addition Card -->
<div class="card">
    <div class="card-header">
        <span class="card-title">➕ Add Emergency Contact</span>
    </div>
    <div class="input-group">
        <input type="text" id="contactName" placeholder="Name (e.g. Papa, Police, Friend)">
        <input type="tel" id="contactPhone" placeholder="10-digit Mobile Number">
        <button class="btn-add" onclick="addContact()">Save to Offline Storage</button>
    </div>
</div>

<!-- Saved Contacts Display Card -->
<div class="card">
    <div class="card-header">
        <span class="card-title">📋 Saved Emergency Contacts</span>
        <span id="contactCount" style="font-size: 11px; color: var(--text-sub);">0 Saved</span>
    </div>
    <div class="contacts-list" id="contactsContainer"></div>
</div>

<script>
    function getContacts() {
        return JSON.parse(localStorage.getItem("safeshift_contacts") || "[]");
    }

    function renderContacts() {
        var contacts = getContacts();
        var container = document.getElementById("contactsContainer");
        var countBadge = document.getElementById("contactCount");

        countBadge.innerText = contacts.length + " Saved";
        container.innerHTML = "";

        if (contacts.length === 0) {
            container.innerHTML = '<div class="empty-text">Koi contact saved nahi hai. Niche add karein!</div>';
            return;
        }

        contacts.forEach(function(item, index) {
            var div = document.createElement("div");
            div.className = "contact-item";
            div.innerHTML = `
                <div class="contact-info">
                    <span class="contact-name">${item.name}</span>
                    <span class="contact-num">📞 ${item.phone}</span>
                </div>
                <button class="btn-del" onclick="deleteContact(${index})">✕</button>
            `;
            container.appendChild(div);
        });
    }

    function addContact() {
        var name = document.getElementById("contactName").value.trim();
        var phone = document.getElementById("contactPhone").value.trim();

        if (!name || phone.length < 10) {
            alert("Kripya sahi naam aur 10-digit number enter karein.");
            return;
        }

        var contacts = getContacts();
        contacts.push({ name: name, phone: phone });
        localStorage.setItem("safeshift_contacts", JSON.stringify(contacts));

        document.getElementById("contactName").value = "";
        document.getElementById("contactPhone").value = "";
        renderContacts();
    }

    function deleteContact(index) {
        var contacts = getContacts();
        contacts.splice(index, 1);
        localStorage.setItem("safeshift_contacts", JSON.stringify(contacts));
        renderContacts();
    }

    function triggerSOS() {
        var contacts = getContacts();
        if (contacts.length === 0) {
            alert("Pehle kam se kam ek Emergency Contact add karein!");
            return;
        }

        // Sabhi saved contacts ko list format me string bana kar native bridge ko bhejna
        var phoneNumbers = contacts.map(c => c.phone).join(",");

        if (window.AndroidBridge) {
            window.AndroidBridge.triggerOfflineEmergency(phoneNumbers);
        } else {
            alert("Triggered for: " + phoneNumbers);
        }
    }

    window.onload = renderContacts;
</script>
</body>
</html>
